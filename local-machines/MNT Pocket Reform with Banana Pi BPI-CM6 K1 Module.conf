SYSIMAGE="pocket-reform-system-k1jin"
TARGET_ARCH="riscv64"
DTBPATH="spacemit/k1-bananapi-cm6-mnt-pocket-reform.dtb"
EMMC_USE=true
EMMC_BOOT=warn
SD_BOOT=true
DEV_MMC="mmcblk0"
DEV_MMC_BOOT0=false
DEV_SD="mmcblk1"
DEV_SSD="nvme0n1"
DEV_USB="sda"
BOOTLOADER_PROJECT="u-boot"
BOOTLOADER_TAG="v2027.01-rc3"
BOOTLOADER_SHA1="source-only"
BOOTLOADER_BUILD_SCRIPT="k1-uboot-build.sh"
UBOOT_DEFCONFIG="spacemit_k1_mnt_pocket_reform_defconfig"
UBOOT_CROSS_COMPILE="riscv64-linux-gnu-"
BOOTLOADER_OFFSET=512
FLASHBIN_OFFSET=512
BOOTLOADER_HEAD_BYTES=80
NEED_NONFREE=false
BOOTARGS="ro no_console_suspend cryptomgr.notests console=ttyS0,115200 fbcon=font:TER16x32 plymouth.ignore-serial-consoles console=tty1"
