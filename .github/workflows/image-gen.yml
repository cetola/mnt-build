name: Remote Image Gen

on:
  workflow_dispatch:
    inputs:
      sysimage:
        description: Target sysimage to build
        required: true
        type: choice
        options:
          - pocket-reform-system-a311d
          - reform-next-system-rk3588
          - pocket-reform-system-rk3588
      bootloader_mode:
        description: Bootloader artifact source mode
        required: true
        default: prebuilt
        type: choice
        options:
          - prebuilt
          - source
      uboot_sha:
        description: Optional U-Boot commit SHA (used in source mode)
        required: false
        type: string
      zero_fill_max_mb:
        description: Max MiB for bounded zero-fill before final trim
        required: true
        default: "2048"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Launch EC2 Spot instance
        id: launch-instance
        run: |
          set -euo pipefail
          AVAILABILITY_ZONES=("us-west-2a" "us-west-2b" "us-west-2c" "us-west-2d")
          INSTANCE_ID=""
          USER_DATA='#!/bin/bash
              usermod -u 1001 ubuntu
              groupmod -g 1001 ubuntu
              chown -R ubuntu:ubuntu /home/ubuntu'

          echo "Attempting to launch instance (AWS-selected zone)..."
          OUTPUT=$(aws ec2 run-instances \
            --image-id ami-00f46ccd1cbfb363e \
            --instance-type c6i.8xlarge \
            --instance-market-options '{"MarketType":"spot","SpotOptions":{"SpotInstanceType":"one-time","MaxPrice":"0.70"}}' \
            --key-name github-actions-runner \
            --security-group-ids sg-09c18dc7c46327e69 \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":80,"VolumeType":"gp3"}}]' \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=github-runner}]' \
            --user-data "$USER_DATA" \
            --query 'Instances[0].InstanceId' \
            --output text 2>&1 || true)

          if [[ "$OUTPUT" != i-* ]]; then
            echo "First attempt failed, trying explicit AZs..."
            for AZ in "${AVAILABILITY_ZONES[@]}"; do
              OUTPUT=$(aws ec2 run-instances \
                --image-id ami-00f46ccd1cbfb363e \
                --instance-type c6i.8xlarge \
                --instance-market-options '{"MarketType":"spot","SpotOptions":{"SpotInstanceType":"one-time","MaxPrice":"0.70"}}' \
                --key-name github-actions-runner \
                --security-group-ids sg-09c18dc7c46327e69 \
                --placement AvailabilityZone="$AZ" \
                --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":80,"VolumeType":"gp3"}}]' \
                --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=github-runner}]' \
                --user-data "$USER_DATA" \
                --query 'Instances[0].InstanceId' \
                --output text 2>&1 || true)
              if [[ "$OUTPUT" == i-* ]]; then
                break
              fi
              echo "Failed in $AZ: $OUTPUT"
            done
          fi

          if [[ "$OUTPUT" != i-* ]]; then
            echo "Failed to launch EC2 instance: $OUTPUT" >&2
            exit 1
          fi

          INSTANCE_ID="$OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_rsa "ubuntu@$PUBLIC_IP" echo "SSH Ready" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done

          # If cloud-init is still running package tasks, wait here so apt lock is released.
          ssh -T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "ubuntu@$PUBLIC_IP" \
            'cloud-init status --wait || true'

      - name: Setup repository on instance
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          ssh-keyscan -H "$PUBLIC_IP" >> ~/.ssh/known_hosts

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << 'EOF'
            set -euo pipefail
            cd ~
            git clone --depth 1 --no-checkout https://github.com/${{ github.repository }} mnt-build
            cd mnt-build
            git fetch --depth 1 origin ${{ github.sha }}
            git checkout ${{ github.sha }}
            git submodule sync -- reform-tools
            git -c protocol.version=2 submodule update --init --depth 1 reform-tools
          EOF

      - name: Install image-gen host dependencies on instance
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << 'EOF'
            set -euo pipefail
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y \
              coreutils \
              util-linux \
              parted \
              e2fsprogs \
              curl \
              tar \
              cpio \
              gcc-aarch64-linux-gnu \
              binutils-aarch64-linux-gnu \
              qemu-user-static \
              binfmt-support \
              bmap-tools \
              zstd \
              git \
              build-essential \
              make \
              pkg-config \
              libssl-dev \
              bc \
              flex \
              bison \
              device-tree-compiler
          EOF

      - name: Run image-gen on instance
        id: run_image_gen
        continue-on-error: true
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          SYSIMAGE="$(printf '%s' "${{ github.event.inputs.sysimage }}" | tr -d '\r\n')"
          BOOTLOADER_SOURCE_MODE="$(printf '%s' "${{ github.event.inputs.bootloader_mode }}" | tr -d '\r\n')"
          UBOOT_SHA="$(printf '%s' "${{ github.event.inputs.uboot_sha }}" | tr -d '\r\n')"
          ZERO_FILL_MAX_MB="$(printf '%s' "${{ github.event.inputs.zero_fill_max_mb }}" | tr -d '\r\n')"

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << EOF
            set -euo pipefail
            cd ~/mnt-build
            chmod +x ./scripts/image-gen.sh
            export BOOTLOADER_SOURCE_MODE="$BOOTLOADER_SOURCE_MODE"
            export UBOOT_SHA="$UBOOT_SHA"
            export ZERO_FILL_MAX_MB="$ZERO_FILL_MAX_MB"
            sudo --preserve-env=BOOTLOADER_SOURCE_MODE,UBOOT_SHA,ZERO_FILL_MAX_MB \
              ./scripts/image-gen.sh --sysimage "$SYSIMAGE"
          EOF

      - name: Diagnose EC2 state after image-gen failure
        if: ${{ steps.run_image_gen.outcome != 'success' }}
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.launch-instance.outputs.instance_id }}"
          echo "Image-gen failed. Dumping EC2 instance state for diagnosis..."
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].{State:State.Name,StateReason:StateReason,PublicIp:PublicIpAddress,LaunchTime:LaunchTime,InstanceLifecycle:InstanceLifecycle}' \
            --output json || true
          aws ec2 describe-instance-status \
            --instance-ids "$INSTANCE_ID" \
            --include-all-instances \
            --query 'InstanceStatuses[0].{InstanceState:InstanceState.Name,SystemStatus:SystemStatus,InstanceStatus:InstanceStatus,Events:Events}' \
            --output json || true

      - name: Package outputs on instance
        if: ${{ steps.run_image_gen.outcome == 'success' }}
        id: package_outputs
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << 'EOF'
            set -euo pipefail
            cd ~/mnt-build
            mkdir -p dist

            IMG="$(ls -1 mnt-reform-*-aarch64.img | head -n 1)"
            BMAP="${IMG}.bmap"

            zstd -T0 -19 --rm "$IMG"
            IMG_ZST="${IMG}.zst"

            cp -v "$IMG_ZST" dist/
            if [[ -f "$BMAP" ]]; then
              cp -v "$BMAP" dist/
            else
              echo "WARNING: ${BMAP} not found." | tee dist/WARNING-no-bmap.txt
            fi

            if ls -1 image-gen-*.log >/dev/null 2>&1; then
              cp -v image-gen-*.log dist/
            fi

            pushd dist >/dev/null
            sha256sum "$(basename "$IMG_ZST")" > "$(basename "$IMG_ZST").sha256"
            {
              echo "Build date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Sysimage: ${{ github.event.inputs.sysimage }}"
              echo "Bootloader mode: ${{ github.event.inputs.bootloader_mode }}"
              if [[ -n "${{ github.event.inputs.uboot_sha }}" ]]; then
                echo "U-Boot SHA: ${{ github.event.inputs.uboot_sha }}"
              fi
              echo "PACMAN_FULL_UPGRADE: 1"
              echo "INSTALL_REFORM_TOOLS: 1"
              echo "ZERO_FILL_MAX_MB: ${{ github.event.inputs.zero_fill_max_mb }}"
              echo
              echo "Files:"
              ls -lh
              echo
              echo "SHA256:"
              cat *.sha256
            } > MANIFEST.txt
            popd >/dev/null
          EOF

      - name: Collect logs
        if: always()
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          mkdir -p build-logs

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << 'EOF'
            set -euo pipefail
            find ~/mnt-build -maxdepth 1 -name "*.log" -type f -exec cp {} /tmp/ \; || true
            find ~/mnt-build/scripts -name "*.log" -type f -exec cp {} /tmp/ \; || true
            find ~/mnt-build/image-gen -name "*.log" -type f -exec cp {} /tmp/ \; || true
          EOF
          scp $SSH_OPTS "ubuntu@$PUBLIC_IP:/tmp/*.log" build-logs/ 2>/dev/null || true
          ls -lh build-logs/ || true

      - name: Copy image artifacts back
        if: ${{ steps.run_image_gen.outcome == 'success' }}
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          mkdir -p dist
          scp $SSH_OPTS -r "ubuntu@$PUBLIC_IP:~/mnt-build/dist/*" dist/
          ls -lh dist/

      - name: Terminate EC2 instance
        if: always()
        run: |
          aws ec2 terminate-instances --instance-ids "${{ steps.launch-instance.outputs.instance_id }}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-gen-logs
          path: build-logs/*
          if-no-files-found: warn

      - name: Upload image artifacts
        if: ${{ steps.run_image_gen.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mnt-reform-image-${{ github.event.inputs.sysimage }}
          path: dist/*
          if-no-files-found: error
