name: Remote Image Gen aarch64

on:
  workflow_dispatch:
    inputs:
      sysimage:
        description: Target sysimage to build
        required: true
        type: choice
        options:
          - pocket-reform-system-a311d
          - reform-next-system-rk3588
          - pocket-reform-system-rk3588
          - pocket-reform-system-rk3588s
          - pocket-reform-system-imx8mp
      bootloader:
        description: Bootloader to build. barebox-source only works for RK3588/S sysimages.
        required: true
        default: uboot-prebuilt
        type: choice
        options:
          - uboot-prebuilt
          - uboot-source
          - barebox-source
      uboot_sha:
        description: Optional U-Boot commit SHA (used with uboot-source)
        required: false
        type: string
      zero_fill_max_mb:
        description: Max MiB for bounded zero-fill before final trim
        required: true
        default: "2048"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Launch EC2 ARM instance
        id: launch-instance
        run: |
          set -euo pipefail
          AVAILABILITY_ZONES=("us-west-2a" "us-west-2b" "us-west-2c" "us-west-2d")
          INSTANCE_ID=""

          ARM64_AMI=$(aws ssm get-parameter \
            --name /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id \
            --query 'Parameter.Value' \
            --output text)
          echo "Using AMI: $ARM64_AMI"

          echo "Attempting to launch instance (AWS-selected zone)..."
          OUTPUT=$(aws ec2 run-instances \
            --image-id "$ARM64_AMI" \
            --instance-type c7g.8xlarge \
            --key-name github-actions-runner \
            --security-group-ids sg-09c18dc7c46327e69 \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":80,"VolumeType":"gp3"}}]' \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=github-runner-arm64}]' \
            --query 'Instances[0].InstanceId' \
            --output text 2>&1 || true)

          if [[ "$OUTPUT" != i-* ]]; then
            echo "First attempt failed, trying explicit AZs..."
            for AZ in "${AVAILABILITY_ZONES[@]}"; do
              OUTPUT=$(aws ec2 run-instances \
                --image-id "$ARM64_AMI" \
                --instance-type c7g.8xlarge \
                --key-name github-actions-runner \
                --security-group-ids sg-09c18dc7c46327e69 \
                --placement AvailabilityZone="$AZ" \
                --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":80,"VolumeType":"gp3"}}]' \
                --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=github-runner-arm64}]' \
                --query 'Instances[0].InstanceId' \
                --output text 2>&1 || true)
              if [[ "$OUTPUT" == i-* ]]; then
                echo "Successfully launched instance in $AZ: $OUTPUT"
                break
              fi
              echo "Failed in $AZ: $OUTPUT"
            done
          fi

          if [[ "$OUTPUT" != i-* ]]; then
            echo "Failed to launch EC2 instance: $OUTPUT" >&2
            exit 1
          fi

          INSTANCE_ID="$OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "Instance running at: $PUBLIC_IP"

          echo "Waiting for SSH to be ready..."
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_rsa "ubuntu@$PUBLIC_IP" echo "SSH Ready" 2>/dev/null; then
              echo "SSH is ready!"
              break
            fi
            echo "Waiting for SSH... attempt $i/30"
            sleep 10
          done

      - name: Setup repository on instance
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          ssh-keyscan -H "$PUBLIC_IP" >> ~/.ssh/known_hosts

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << 'EOF'
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y \
              parted \
              e2fsprogs \
              cpio \
              bmap-tools \
              zstd
            cd ~
            git clone --depth 1 --no-checkout https://github.com/${{ github.repository }} mnt-build
            cd mnt-build
            git fetch --depth 1 origin ${{ github.sha }}
            git checkout ${{ github.sha }}
            git submodule sync -- reform-tools
            git -c protocol.version=2 submodule update --init --depth 1 reform-tools
          EOF

      - name: Run image-gen-aarch64.sh on instance
        id: run_image_gen
        continue-on-error: true
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          SYSIMAGE="$(printf '%s' "${{ github.event.inputs.sysimage }}" | tr -d '\r\n')"
          BOOTLOADER="$(printf '%s' "${{ github.event.inputs.bootloader }}" | tr -d '\r\n')"
          UBOOT_SHA="$(printf '%s' "${{ github.event.inputs.uboot_sha }}" | tr -d '\r\n')"
          ZERO_FILL_MAX_MB="$(printf '%s' "${{ github.event.inputs.zero_fill_max_mb }}" | tr -d '\r\n')"
          REMOTE_STATE_DIR="~/mnt-build/.gha-image-gen"
          REMOTE_EXIT_CODE="${REMOTE_STATE_DIR}/exit_code"
          REMOTE_PID_FILE="${REMOTE_STATE_DIR}/pid"
          REMOTE_LOG="~/mnt-build/image-gen-remote-run.log"

          q_bootloader="$(printf '%q' "$BOOTLOADER")"
          q_uboot_sha="$(printf '%q' "$UBOOT_SHA")"
          q_zero_fill="$(printf '%q' "$ZERO_FILL_MAX_MB")"
          q_sysimage="$(printf '%q' "$SYSIMAGE")"
          remote_payload="cd ~/mnt-build || exit 97; chmod +x ./scripts/image-gen-aarch64.sh; export UBOOT_SHA=${q_uboot_sha}; export ZERO_FILL_MAX_MB=${q_zero_fill}; sudo --preserve-env=UBOOT_SHA,ZERO_FILL_MAX_MB ./scripts/image-gen-aarch64.sh --sysimage ${q_sysimage} --bootloader ${q_bootloader}; rc=\$?; echo \$rc > ${REMOTE_EXIT_CODE}; exit \$rc"
          q_remote_payload="$(printf '%q' "$remote_payload")"

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" "set -euo pipefail; \
            mkdir -p ${REMOTE_STATE_DIR}; \
            rm -f ${REMOTE_EXIT_CODE}; \
            rm -f ${REMOTE_PID_FILE}; \
            nohup bash -lc ${q_remote_payload} > ${REMOTE_LOG} 2>&1 < /dev/null & \
            echo \$! > ${REMOTE_PID_FILE}"

          echo "Remote image-gen launched. Polling for completion..."
          max_polls=120   # 1h at 30s intervals
          poll_interval=30
          final_rc=""
          prev_tail=""
          instance_id="${{ steps.launch-instance.outputs.instance_id }}"
          for ((i=1; i<=max_polls; i++)); do
            status="$(ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" "if [[ -f ${REMOTE_EXIT_CODE} ]]; then cat ${REMOTE_EXIT_CODE}; else echo RUNNING; fi" 2>/dev/null || echo SSH_RETRY)"
            status="$(printf '%s' "$status" | tr -d '\r\n')"
            if [[ "$status" == "RUNNING" || "$status" == "SSH_RETRY" || -z "$status" ]]; then
              if [[ "$status" == "SSH_RETRY" || -z "$status" ]]; then
                ec2_state="$(aws ec2 describe-instances \
                  --instance-ids "$instance_id" \
                  --query 'Reservations[0].Instances[0].State.Name' \
                  --output text 2>/dev/null || echo unknown)"
                if [[ "$ec2_state" != "running" ]]; then
                  echo "EC2 instance is no longer running (state=$ec2_state). Failing image-gen poll early." >&2
                  aws ec2 describe-instances \
                    --instance-ids "$instance_id" \
                    --query 'Reservations[0].Instances[0].{State:State.Name,StateReason:StateReason,StateTransitionReason:StateTransitionReason,InstanceLifecycle:InstanceLifecycle,PublicIp:PublicIpAddress}' \
                    --output json || true
                  exit 143
                fi
                echo "SSH unreachable but EC2 state is still 'running'; will retry poll." >&2
              fi
              elapsed_min=$(( (i * poll_interval) / 60 ))
              log_tail="$(ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" "tail -n 5 ~/mnt-build/image-gen-remote-run.log 2>/dev/null" || true)"
              if [[ -n "$log_tail" && "$log_tail" != "$prev_tail" ]]; then
                echo "[poll ${i}/${max_polls} | ~${elapsed_min}m] image-gen progress:"
                echo "$log_tail"
                prev_tail="$log_tail"
              else
                echo "[poll ${i}/${max_polls} | ~${elapsed_min}m] image-gen still running..."
              fi
              sleep "$poll_interval"
              continue
            fi
            final_rc="$status"
            break
          done

          if [[ -z "$final_rc" ]]; then
            echo "Timed out waiting for remote image-gen completion (1h cap)." >&2
            echo "Attempting to collect logs before forced termination..."
            mkdir -p build-logs || true
            scp $SSH_OPTS "ubuntu@$PUBLIC_IP:~/mnt-build/image-gen-remote-run.log" build-logs/ 2>/dev/null || true
            scp $SSH_OPTS "ubuntu@$PUBLIC_IP:~/mnt-build/image-gen-*.log" build-logs/ 2>/dev/null || true
            aws ec2 terminate-instances --instance-ids "${{ steps.launch-instance.outputs.instance_id }}" || true
            exit 124
          fi

          echo "Remote image-gen exit code: $final_rc"
          if [[ "$final_rc" != "0" ]]; then
            exit "$final_rc"
          fi

      - name: Diagnose EC2 state after image-gen failure
        if: ${{ steps.run_image_gen.outcome != 'success' }}
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.launch-instance.outputs.instance_id }}"
          echo "Image-gen failed. Dumping EC2 instance state for diagnosis..."
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].{State:State.Name,StateReason:StateReason,PublicIp:PublicIpAddress,LaunchTime:LaunchTime,InstanceLifecycle:InstanceLifecycle}' \
            --output json || true
          aws ec2 describe-instance-status \
            --instance-ids "$INSTANCE_ID" \
            --include-all-instances \
            --query 'InstanceStatuses[0].{InstanceState:InstanceState.Name,SystemStatus:SystemStatus,InstanceStatus:InstanceStatus,Events:Events}' \
            --output json || true

      - name: Package outputs on instance
        if: ${{ steps.run_image_gen.outcome == 'success' }}
        id: package_outputs
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << 'EOF'
            set -euo pipefail
            cd ~/mnt-build
            mkdir -p dist
            OUTPUT_DIR="image-gen/downloads"

            IMG="$(find "${OUTPUT_DIR}" -maxdepth 1 -type f -name 'arch-sys-mnt-*.img' | sort | head -n 1)"
            BMAP="${IMG}.bmap"

            zstd -T0 -19 --rm "$IMG"
            IMG_ZST="${IMG}.zst"

            cp -v "$IMG_ZST" dist/
            if [[ -f "$BMAP" ]]; then
              cp -v "$BMAP" dist/
            else
              echo "WARNING: ${BMAP} not found." | tee dist/WARNING-no-bmap.txt
            fi

            if ls -1 "${OUTPUT_DIR}"/image-gen-*.log >/dev/null 2>&1; then
              cp -v "${OUTPUT_DIR}"/image-gen-*.log dist/
            fi

            pushd dist >/dev/null
            sha256sum "$(basename "$IMG_ZST")" > "$(basename "$IMG_ZST").sha256"
            {
              echo "Build date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Sysimage: ${{ github.event.inputs.sysimage }}"
              echo "Bootloader: ${{ github.event.inputs.bootloader }}"
              if [[ -n "${{ github.event.inputs.uboot_sha }}" ]]; then
                echo "U-Boot SHA: ${{ github.event.inputs.uboot_sha }}"
              fi
              echo "ZERO_FILL_MAX_MB: ${{ github.event.inputs.zero_fill_max_mb }}"
              echo
              echo "Files:"
              ls -lh
              echo
              echo "SHA256:"
              cat *.sha256
            } > MANIFEST.txt
            popd >/dev/null
          EOF

      - name: Collect logs
        if: always()
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          mkdir -p build-logs

          ssh $SSH_OPTS "ubuntu@$PUBLIC_IP" << 'EOF'
            set -euo pipefail
            find ~/mnt-build -maxdepth 1 -name "*.log" -type f -exec cp {} /tmp/ \; || true
            find ~/mnt-build/scripts -name "*.log" -type f -exec cp {} /tmp/ \; || true
            find ~/mnt-build/image-gen -name "*.log" -type f -exec cp {} /tmp/ \; || true
          EOF
          scp $SSH_OPTS "ubuntu@$PUBLIC_IP:/tmp/*.log" build-logs/ 2>/dev/null || true
          ls -lh build-logs/ || true

      - name: Copy image artifacts back
        if: ${{ steps.run_image_gen.outcome == 'success' }}
        run: |
          set -euo pipefail
          PUBLIC_IP="${{ steps.launch-instance.outputs.public_ip }}"
          SSH_OPTS="-T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=15"
          mkdir -p dist
          scp $SSH_OPTS -r "ubuntu@$PUBLIC_IP:~/mnt-build/dist/*" dist/
          ls -lh dist/

      - name: Terminate EC2 instance
        if: always()
        run: |
          aws ec2 terminate-instances --instance-ids "${{ steps.launch-instance.outputs.instance_id }}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-gen-logs
          path: build-logs/*
          if-no-files-found: warn

      - name: Upload image artifacts
        if: ${{ steps.run_image_gen.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mnt-reform-image-${{ github.event.inputs.sysimage }}
          path: dist/*
          if-no-files-found: error
