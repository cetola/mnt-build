name: Local Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve build configuration
        id: build_config
        run: |
          REF_NAME="${GITHUB_REF_NAME}"

          if [[ "$REF_NAME" == *-x86_64 ]]; then
            echo "arch=x86_64" >> "$GITHUB_OUTPUT"
            echo "cross_compile=none" >> "$GITHUB_OUTPUT"
          else
            echo "arch=arm64" >> "$GITHUB_OUTPUT"
            echo "cross_compile=aarch64-linux-gnu-" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set permissions and build Docker container
        run: |
          cd scripts
          chmod +x build-container.sh run-container.sh
          ./build-container.sh

      - name: Run build-auto.py inside container
        id: run_build
        continue-on-error: true
        run: |
          cd scripts
          ./run-container.sh "python3 build-auto.py --with-headers --arch ${{ steps.build_config.outputs.arch }} --cross-compile ${{ steps.build_config.outputs.cross_compile }}"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p release-artifacts/logs

          echo "Copying logs..."
          find . -maxdepth 1 -name "*.log" -type f -print -exec cp {} release-artifacts/logs/ \;
          find ./scripts -name "*.log" -type f -print -exec cp {} release-artifacts/logs/ \;

          echo "Log archive contents:"
          ls -al release-artifacts/logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: release-artifacts/logs

      - name: Find and collect build artifacts
        id: collect_artifacts
        if: ${{ steps.run_build.outcome == 'success' }}
        run: |
          HEADERS_TARBALL=$(find . -name "headers-*-mnt.tar.gz" -type f)
          KERNEL_TARBALL=$(find . -name "kernel-*-mnt.tar.gz" -type f)
          LPC_MODULE=$(find . -name "reform2_lpc-*-mnt.tar.gz" -type f)
          WIFI_MODULE=$(find . -name "wlan-*-mnt.tar.gz" -type f)

          echo "Found build artifacts:"
          echo "Headers: $HEADERS_TARBALL"
          echo "Kernel: $KERNEL_TARBALL"
          echo "LPC module: $LPC_MODULE"
          echo "WiFi module: $WIFI_MODULE"

          mkdir -p release-artifacts

          if [ -n "$HEADERS_TARBALL" ]; then
            cp "$HEADERS_TARBALL" release-artifacts/
          fi

          if [ -n "$KERNEL_TARBALL" ]; then
            cp "$KERNEL_TARBALL" release-artifacts/
          fi

          if [ -n "$LPC_MODULE" ]; then
            cp "$LPC_MODULE" release-artifacts/
          fi

          if [ -n "$WIFI_MODULE" ]; then
            cp "$WIFI_MODULE" release-artifacts/
          fi

          echo "Artifacts directory contents:"
          ls -lh release-artifacts/

      - name: Upload artifacts
        if: ${{ steps.collect_artifacts.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: release-artifacts/*-mnt.tar.gz

      - name: Create Release
        if: >
          startsWith(github.ref, 'refs/tags/') &&
          steps.run_build.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-artifacts/*-mnt.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
