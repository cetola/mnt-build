name: Local Build and Release

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture, e.g. arm64 or x86_64
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x86_64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve build configuration
        id: build_config
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          REF="${GITHUB_REF}"
          EVENT_NAME="${GITHUB_EVENT_NAME}"
          release_arch="arm64"
          cross_compile="aarch64-linux-gnu-"
          prerelease="false"
          BUILD_VERSION="$(python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from config import DEFAULT_KERNEL_VERSION, DEFAULT_LOCALVERSION_REV
          print(f"{DEFAULT_KERNEL_VERSION}.reform{DEFAULT_LOCALVERSION_REV}")
          PY
          )"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ARCH_INPUT="$(printf '%s' '${{ github.event.inputs.arch }}' | tr -d '\r\n')"

            if [[ "$REF" == "refs/heads/main" ]]; then
              if [[ "$ARCH_INPUT" == "x86_64" ]]; then
                release_arch="x86_64"
                cross_compile="none"
              fi
            elif [[ "$REF" != refs/tags/* ]]; then
              echo "workflow_dispatch must target main or a tag" >&2
              exit 1
            fi
          elif [[ "$REF_NAME" == *-x86_64 || "$REF_NAME" == *-x86 ]]; then
            release_arch="x86_64"
            cross_compile="none"
          fi

          if [[ "$REF" == refs/tags/pre-* ]]; then
            prerelease="true"
          fi

          if [[ "${release_arch}" == "x86_64" ]]; then
            RELEASE_TAG="${BUILD_VERSION}-x86_64"
          else
            RELEASE_TAG="${BUILD_VERSION}-aarch64"
          fi

          if [[ "$REF" == refs/tags/* ]]; then
            RELEASE_TAG="${REF_NAME}"
          fi

          echo "arch=${release_arch}" >> "$GITHUB_OUTPUT"
          echo "cross_compile=${cross_compile}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Print resolved build configuration
        run: |
          echo "build_version=${{ steps.build_config.outputs.build_version }}"
          echo "arch=${{ steps.build_config.outputs.arch }}"
          echo "cross_compile=${{ steps.build_config.outputs.cross_compile }}"
          echo "release_tag=${{ steps.build_config.outputs.release_tag }}"
          echo "prerelease=${{ steps.build_config.outputs.prerelease }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set permissions and build Docker container
        run: |
          cd scripts
          chmod +x build-container.sh run-container.sh
          ./build-container.sh

      - name: Run build-auto.py inside container
        id: run_build
        continue-on-error: true
        run: |
          cd scripts
          ./run-container.sh "python3 build-auto.py --with-headers --arch ${{ steps.build_config.outputs.arch }} --cross-compile ${{ steps.build_config.outputs.cross_compile }}"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p release-artifacts/logs

          echo "Copying logs..."
          find . -maxdepth 1 -name "*.log" -type f -print -exec cp {} release-artifacts/logs/ \;
          find ./scripts -name "*.log" -type f -print -exec cp {} release-artifacts/logs/ \;

          echo "Log archive contents:"
          ls -al release-artifacts/logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: release-artifacts/logs

      - name: Find and collect build artifacts
        id: collect_artifacts
        if: ${{ steps.run_build.outcome == 'success' }}
        run: |
          HEADERS_TARBALL=$(find . -name "headers-*.tar.gz" -type f)
          KERNEL_TARBALL=$(find . -name "kernel-*.tar.gz" -type f)
          LPC_MODULE=$(find . -name "reform2_lpc-*.tar.gz" -type f)
          WIFI_MODULE=$(find . -name "wlan-*.tar.gz" -type f)

          echo "Found build artifacts:"
          echo "Headers: $HEADERS_TARBALL"
          echo "Kernel: $KERNEL_TARBALL"
          echo "LPC module: $LPC_MODULE"
          echo "WiFi module: $WIFI_MODULE"

          mkdir -p release-artifacts

          if [ -n "$HEADERS_TARBALL" ]; then
            cp "$HEADERS_TARBALL" release-artifacts/
          fi

          if [ -n "$KERNEL_TARBALL" ]; then
            cp "$KERNEL_TARBALL" release-artifacts/
          fi

          if [ -n "$LPC_MODULE" ]; then
            cp "$LPC_MODULE" release-artifacts/
          fi

          if [ -n "$WIFI_MODULE" ]; then
            cp "$WIFI_MODULE" release-artifacts/
          fi

          echo "Artifacts directory contents:"
          ls -lh release-artifacts/

      - name: Upload artifacts
        if: ${{ steps.collect_artifacts.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            release-artifacts/kernel-*.tar.gz
            release-artifacts/headers-*.tar.gz
            release-artifacts/reform2_lpc-*.tar.gz
            release-artifacts/wlan-*.tar.gz

      - name: Create Release
        if: >
          startsWith(github.ref, 'refs/tags/') &&
          steps.run_build.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.build_config.outputs.release_tag }}
          name: ${{ steps.build_config.outputs.release_tag }}
          files: |
            release-artifacts/kernel-*.tar.gz
            release-artifacts/headers-*.tar.gz
            release-artifacts/reform2_lpc-*.tar.gz
            release-artifacts/wlan-*.tar.gz
          draft: false
          prerelease: ${{ steps.build_config.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
