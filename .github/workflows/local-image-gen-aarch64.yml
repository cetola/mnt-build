name: Local Image Gen aarch64

on:
  workflow_dispatch:
    inputs:
      sysimage:
        description: Target sysimage to build
        required: true
        type: choice
        options:
          - pocket-reform-system-a311d
          - reform-next-system-rk3588
          - pocket-reform-system-rk3588
          - pocket-reform-system-rk3588s
          - pocket-reform-system-imx8mp
      bootloader:
        description: Bootloader to build. barebox-source only works for RK3588/S sysimages.
        required: true
        default: uboot-prebuilt
        type: choice
        options:
          - uboot-prebuilt
          - uboot-source
          - barebox-source
      uboot_sha:
        description: Optional U-Boot commit SHA (used with uboot-source)
        required: false
        type: string
      zero_fill_max_mb:
        description: Max MiB for bounded zero-fill before final trim
        required: true
        default: "2048"
        type: string
  workflow_call:
    inputs:
      sysimage:
        required: true
        type: string
      bootloader:
        required: false
        default: uboot-prebuilt
        type: string
      uboot_sha:
        required: false
        default: ""
        type: string
      zero_fill_max_mb:
        required: false
        default: "2048"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out reform-tools
        run: python3 scripts/reform_tools.py ensure --build-dir .

      - name: Verify checkout
        run: |
          set -euo pipefail
          echo "== Checkout debug =="
          echo "pwd: $(pwd)"
          echo "head: $(git rev-parse --short HEAD)"
          echo "reform-tools: $(git -C reform-tools rev-parse --short HEAD)"

          if [[ ! -d ./reform-tools/machines ]]; then
            echo "ERROR: ./reform-tools/machines missing after checkout." >&2
            echo "Repo root listing:" >&2
            ls -la >&2
            exit 1
          fi

          echo "reform-tools/machines listing:"
          ls -la ./reform-tools/machines

      - name: Install required host packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            coreutils \
            util-linux \
            parted \
            e2fsprogs \
            curl \
            tar \
            cpio \
            bmap-tools \
            zstd \
            uuid-dev \
            libgnutls28-dev \
            libssl-dev \
            build-essential \
            bison \
            flex \
            python3-dev \
            swig \
            gcc-aarch64-linux-gnu \
            python3-pyelftools

          echo "== Versions =="
          parted --version || true
          losetup --version || true
          mkfs.ext4 -V || true

      - name: Preflight sysimage config resolution
        run: |
          set -euo pipefail
          SYSIMAGE="$(printf '%s' "${{ inputs.sysimage }}" | tr -d '\r\n')"
          MACHINES_DIRS=("./local-machines" "./reform-tools/machines")

          CONF=""
          for dir in "${MACHINES_DIRS[@]}"; do
            [[ -d "$dir" ]] || continue
            CONF="$(grep -R -l --include='*.conf' --fixed-strings "SYSIMAGE=\"$SYSIMAGE\"" "$dir" | head -n1 || true)"
            [[ -n "$CONF" ]] && break
          done

          if [[ -z "$CONF" ]]; then
            echo "No machine config found for $SYSIMAGE" >&2
            echo "Available SYSIMAGE values:" >&2
            for dir in "${MACHINES_DIRS[@]}"; do
              [[ -d "$dir" ]] || continue
              grep -R -h --include='*.conf' '^SYSIMAGE=' "$dir" | sed -E 's/^SYSIMAGE=\"(.*)\"$/\1/' | sort -u >&2
            done
            exit 1
          fi

          echo "Resolved sysimage: $SYSIMAGE"
          echo "Resolved machine config: $CONF"

      - name: Print selected workflow inputs
        run: |
          set -euo pipefail
          SYSIMAGE="$(printf '%s' "${{ inputs.sysimage }}" | tr -d '\r\n')"
          BOOTLOADER="$(printf '%s' "${{ inputs.bootloader }}" | tr -d '\r\n')"
          UBOOT_SHA="$(printf '%s' "${{ inputs.uboot_sha }}" | tr -d '\r\n')"
          ZERO_FILL_MAX_MB="$(printf '%s' "${{ inputs.zero_fill_max_mb }}" | tr -d '\r\n')"

          echo "Selected inputs:"
          echo "  sysimage=$SYSIMAGE"
          echo "  bootloader=$BOOTLOADER"
          if [[ -n "$UBOOT_SHA" ]]; then
            echo "  uboot_sha=$UBOOT_SHA"
          else
            echo "  uboot_sha=<empty>"
          fi
          echo "  zero_fill_max_mb=$ZERO_FILL_MAX_MB"

          {
            echo "### Selected Workflow Inputs"
            echo ""
            echo "- sysimage: \`$SYSIMAGE\`"
            echo "- bootloader: \`$BOOTLOADER\`"
            if [[ -n "$UBOOT_SHA" ]]; then
              echo "- uboot_sha: \`$UBOOT_SHA\`"
            else
              echo "- uboot_sha: *(empty)*"
            fi
            echo "- zero_fill_max_mb: \`$ZERO_FILL_MAX_MB\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run image-gen.sh on runner (as root)
        run: |
          set -euo pipefail
          chmod +x ./scripts/image-gen.sh
          BOOTLOADER="$(printf '%s' "${{ inputs.bootloader }}" | tr -d '\r\n')"
          UBOOT_SHA="$(printf '%s' "${{ inputs.uboot_sha }}" | tr -d '\r\n')"
          ZERO_FILL_MAX_MB="$(printf '%s' "${{ inputs.zero_fill_max_mb }}" | tr -d '\r\n')"
          echo "Using bootloader=${BOOTLOADER}"
          if [[ -n "${UBOOT_SHA}" ]]; then
            echo "Using UBOOT_SHA=${UBOOT_SHA}"
          fi
          echo "Using ZERO_FILL_MAX_MB=${ZERO_FILL_MAX_MB}"
          export UBOOT_SHA ZERO_FILL_MAX_MB
          sudo --preserve-env=UBOOT_SHA,ZERO_FILL_MAX_MB \
            ./scripts/image-gen.sh --sysimage "${{ inputs.sysimage }}" --bootloader "${BOOTLOADER}"

      - name: Package outputs (zstd, bmap, logs, sha256)
        run: |
          set -euo pipefail

          mkdir -p dist
          OUTPUT_DIR="image-gen/downloads"

          IMG="$(find "${OUTPUT_DIR}" -maxdepth 1 -type f -name 'arch-sys-mnt-*.img' | sort | head -n 1)"
          BMAP="${IMG}.bmap"

          zstd -T0 -19 --rm "$IMG"
          IMG_ZST="${IMG}.zst"

          cp -v "$IMG_ZST" dist/
          if [[ -f "$BMAP" ]]; then
            cp -v "$BMAP" dist/
          else
            echo "WARNING: ${BMAP} not found." | tee dist/WARNING-no-bmap.txt
          fi

          if ls -1 "${OUTPUT_DIR}"/image-gen-*.log >/dev/null 2>&1; then
            cp -v "${OUTPUT_DIR}"/image-gen-*.log dist/
          fi

          pushd dist >/dev/null

          sha256sum "$(basename "$IMG_ZST")" > "$(basename "$IMG_ZST").sha256"

          {
            echo "Build date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Sysimage: ${{ inputs.sysimage }}"
            echo "Bootloader: ${{ inputs.bootloader }}"
            if [[ -n "${{ inputs.uboot_sha }}" ]]; then
              echo "U-Boot SHA: ${{ inputs.uboot_sha }}"
            fi
            echo "ZERO_FILL_MAX_MB: ${{ inputs.zero_fill_max_mb }}"
            echo
            echo "Files:"
            ls -lh
            echo
            echo "SHA256:"
            cat *.sha256
          } > MANIFEST.txt

          popd >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mnt-reform-image-${{ inputs.sysimage }}
          path: dist/*
          if-no-files-found: error
