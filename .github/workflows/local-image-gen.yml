name: Local Image Gen

on:
  workflow_dispatch:
    inputs:
      sysimage:
        description: Target sysimage to build
        required: true
        type: choice
        options:
          - pocket-reform-system-a311d
          - reform-next-system-rk3588
          - pocket-reform-system-rk3588
          - pocket-reform-system-imx8mp
      bootloader_mode:
        description: Bootloader artifact source mode
        required: true
        default: prebuilt
        type: choice
        options:
          - prebuilt
          - source
      uboot_sha:
        description: Optional U-Boot commit SHA (used in source mode)
        required: false
        type: string
      release_target:
        description: Release target for upload (none, latest, or previous-N)
        required: true
        default: none
        type: choice
        options:
          - none
          - latest
          - previous-1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout required submodule (reform-tools only)
        run: |
          set -euo pipefail
          git submodule sync -- reform-tools
          git -c protocol.version=2 submodule update --init --depth 1 reform-tools

      - name: Verify checkout and submodules
        run: |
          set -euo pipefail
          echo "== Checkout debug =="
          echo "pwd: $(pwd)"
          echo "head: $(git rev-parse --short HEAD)"
          echo "submodule status:"
          git submodule status || true

          if [[ ! -d ./reform-tools/machines ]]; then
            echo "ERROR: ./reform-tools/machines missing after checkout." >&2
            echo "Repo root listing:" >&2
            ls -la >&2
            exit 1
          fi

          echo "reform-tools/machines listing:"
          ls -la ./reform-tools/machines

      # Registers binfmt handlers on the runner so aarch64 binaries can run via qemu
      - name: Set up QEMU (binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install required host packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            coreutils \
            util-linux \
            parted \
            e2fsprogs \
            curl \
            tar \
            cpio \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-user-static \
            binfmt-support \
            bmap-tools \
            zstd

          # Useful for debugging if anything still fails
          echo "== Versions =="
          parted --version || true
          losetup --version || true
          mkfs.ext4 -V || true
          qemu-aarch64-static --version || true

      - name: Preflight sysimage config resolution
        run: |
          set -euo pipefail
          SYSIMAGE="$(printf '%s' "${{ github.event.inputs.sysimage }}" | tr -d '\r\n')"
          MACHINES_DIR="./reform-tools/machines"

          if [[ ! -d "$MACHINES_DIR" ]]; then
            echo "ERROR: machines directory does not exist: $MACHINES_DIR" >&2
            echo "Top-level repo entries:" >&2
            ls -1 >&2
            exit 1
          fi

          CONF="$(grep -R -l --include='*.conf' --fixed-strings "SYSIMAGE=\"$SYSIMAGE\"" "$MACHINES_DIR" | head -n1 || true)"
          if [[ -z "$CONF" ]]; then
            echo "No machine config found for $SYSIMAGE under $MACHINES_DIR" >&2
            echo "Available SYSIMAGE values:" >&2
            grep -R -h --include='*.conf' '^SYSIMAGE=' "$MACHINES_DIR" | sed -E 's/^SYSIMAGE=\"(.*)\"$/\1/' | sort -u >&2
            exit 1
          fi

          echo "Resolved sysimage: $SYSIMAGE"
          echo "Resolved machine config: $CONF"

      - name: Print selected workflow inputs
        run: |
          set -euo pipefail
          SYSIMAGE="$(printf '%s' "${{ github.event.inputs.sysimage }}" | tr -d '\r\n')"
          BOOTLOADER_MODE="$(printf '%s' "${{ github.event.inputs.bootloader_mode }}" | tr -d '\r\n')"
          UBOOT_SHA="$(printf '%s' "${{ github.event.inputs.uboot_sha }}" | tr -d '\r\n')"

          echo "Selected inputs:"
          echo "  sysimage=$SYSIMAGE"
          echo "  bootloader_mode=$BOOTLOADER_MODE"
          if [[ -n "$UBOOT_SHA" ]]; then
            echo "  uboot_sha=$UBOOT_SHA"
          else
            echo "  uboot_sha=<empty>"
          fi

          {
            echo "### Selected Workflow Inputs"
            echo ""
            echo "- sysimage: \`$SYSIMAGE\`"
            echo "- bootloader_mode: \`$BOOTLOADER_MODE\`"
            if [[ -n "$UBOOT_SHA" ]]; then
              echo "- uboot_sha: \`$UBOOT_SHA\`"
            else
              echo "- uboot_sha: *(empty)*"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run image-gen.sh on runner (as root)
        run: |
          set -euo pipefail
          chmod +x ./scripts/image-gen.sh
          BOOTLOADER_SOURCE_MODE="$(printf '%s' "${{ github.event.inputs.bootloader_mode }}" | tr -d '\r\n')"
          UBOOT_SHA="$(printf '%s' "${{ github.event.inputs.uboot_sha }}" | tr -d '\r\n')"
          echo "Using BOOTLOADER_SOURCE_MODE=${BOOTLOADER_SOURCE_MODE}"
          if [[ -n "${UBOOT_SHA}" ]]; then
            echo "Using UBOOT_SHA=${UBOOT_SHA}"
          fi
          export BOOTLOADER_SOURCE_MODE UBOOT_SHA
          sudo --preserve-env=BOOTLOADER_SOURCE_MODE,UBOOT_SHA \
            ./scripts/image-gen.sh --sysimage "${{ github.event.inputs.sysimage }}"

      - name: Package outputs (zstd, bmap, logs, sha256)
        run: |
          set -euo pipefail

          mkdir -p dist

          IMG="$(ls -1 mnt-reform-*-aarch64.img | head -n 1)"
          BMAP="${IMG}.bmap"

          # Compress in place and remove raw .img
          zstd -T0 -19 --rm "$IMG"
          IMG_ZST="${IMG}.zst"

          cp -v "$IMG_ZST" dist/
          if [[ -f "$BMAP" ]]; then
            cp -v "$BMAP" dist/
          else
            echo "WARNING: ${BMAP} not found." | tee dist/WARNING-no-bmap.txt
          fi

          if ls -1 image-gen-*.log >/dev/null 2>&1; then
            cp -v image-gen-*.log dist/
          fi

          pushd dist >/dev/null

          sha256sum "$(basename "$IMG_ZST")" > "$(basename "$IMG_ZST").sha256"

          {
            echo "Build date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Sysimage: ${{ github.event.inputs.sysimage }}"
            echo "Bootloader mode: ${{ github.event.inputs.bootloader_mode }}"
            if [[ -n "${{ github.event.inputs.uboot_sha }}" ]]; then
              echo "U-Boot SHA: ${{ github.event.inputs.uboot_sha }}"
            fi
            echo
            echo "Files:"
            ls -lh
            echo
            echo "SHA256:"
            cat *.sha256
          } > MANIFEST.txt

          popd >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mnt-reform-image-${{ github.event.inputs.sysimage }}
          path: dist/*
          if-no-files-found: error

      - name: Resolve release metadata
        id: resolve_release
        if: ${{ github.event.inputs.release_target != 'none' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ github.event.inputs.release_target }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          release_target = os.environ["RELEASE_TARGET"]
          url = f"https://api.github.com/repos/{repo}/releases?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })

          with urllib.request.urlopen(req, timeout=30) as response:
              releases = json.load(response)

          releases = [r for r in releases if not r.get("draft", False)]
          if not releases:
              raise SystemExit("No published releases found; cannot upload release assets.")

          if release_target == "latest":
              idx = 0
          elif release_target.startswith("previous-"):
              idx = int(release_target.split("-", 1)[1])
          else:
              raise SystemExit(f"Unsupported release_target: {release_target}")

          if idx >= len(releases):
              raise SystemExit(f"Requested {release_target}, but only {len(releases)} releases are available.")

          selected = releases[idx]
          tag = selected["tag_name"]
          release_name = (selected.get("name") or tag).replace("\n", " ").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"name={release_name}\n")

          print(f"Resolved release_target={release_target} to tag={tag}, name={release_name}")
          PY

      - name: Prepare release assets (image only)
        if: ${{ github.event.inputs.release_target != 'none' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-dist
          SYSIMAGE="${{ github.event.inputs.sysimage }}"
          ASSET_NAME="mnt-reform-image-${SYSIMAGE}.tar"

          files=(dist/*.img.zst dist/*.img.bmap dist/*.sha256 dist/MANIFEST.txt)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No image files found in dist/ to publish to release." >&2
            exit 1
          fi

          rel_files=()
          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              rel_files+=("$(basename "$f")")
            fi
          done

          if [[ ${#rel_files[@]} -eq 0 ]]; then
            echo "No eligible release files found in dist/." >&2
            exit 1
          fi

          tar -C dist -cf "release-dist/${ASSET_NAME}" "${rel_files[@]}"
          ls -lh release-dist/

      - name: Upload image asset to selected release
        if: ${{ github.event.inputs.release_target != 'none' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.resolve_release.outputs.tag }}
          name: ${{ steps.resolve_release.outputs.name }}
          files: release-dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
