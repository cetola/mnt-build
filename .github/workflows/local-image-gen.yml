name: Local Image Gen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Registers binfmt handlers on the runner so aarch64 binaries can run via qemu
      - name: Set up QEMU (binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install required host packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            coreutils \
            util-linux \
            parted \
            e2fsprogs \
            curl \
            tar \
            qemu-user-static \
            binfmt-support \
            bmap-tools \
            zstd

          # Useful for debugging if anything still fails
          echo "== Versions =="
          parted --version || true
          losetup --version || true
          mkfs.ext4 -V || true
          qemu-aarch64-static --version || true

      - name: Run image-gen.sh on runner (as root)
        run: |
          set -euo pipefail
          chmod +x ./scripts/image-gen.sh
          sudo ./scripts/image-gen.sh

      - name: Fix ownership and permissions of workspace outputs
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" .
          sudo find . -type d -exec chmod 755 {} +
          sudo find . -type f -exec chmod a+r {} +

      - name: Package outputs (zstd, bmap, logs, sha256)
        run: |
          set -euo pipefail

          mkdir -p dist

          IMG="$(ls -1 mnt-pocket-*-aarch64.img | head -n 1)"
          BMAP="${IMG}.bmap"

          # Compress in place and remove raw .img
          zstd -T0 -19 --rm "$IMG"
          IMG_ZST="${IMG}.zst"

          cp -v "$IMG_ZST" dist/
          if [[ -f "$BMAP" ]]; then
            cp -v "$BMAP" dist/
          else
            echo "WARNING: ${BMAP} not found." | tee dist/WARNING-no-bmap.txt
          fi

          if ls -1 image-gen-*.log >/dev/null 2>&1; then
            cp -v image-gen-*.log dist/
          fi

          pushd dist >/dev/null

          sha256sum "$(basename "$IMG_ZST")" > "$(basename "$IMG_ZST").sha256"

          {
            echo "Build date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Files:"
            ls -lh
            echo
            echo "SHA256:"
            cat *.sha256
          } > MANIFEST.txt

          popd >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mnt-pocket-image
          path: dist/*
          if-no-files-found: error

