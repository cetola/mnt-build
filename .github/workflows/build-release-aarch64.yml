name: Remote Build and Release Arm

on:
  push:
    tags:
      - '*-aarch64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Resolve build configuration
        id: build_config
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          REF="${GITHUB_REF}"
          prerelease="false"
          BUILD_VERSION="$(python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from config import DEFAULT_KERNEL_VERSION, DEFAULT_LOCALVERSION_REV
          print(f"{DEFAULT_KERNEL_VERSION}.reform{DEFAULT_LOCALVERSION_REV}")
          PY
          )"
          RELEASE_TAG="${BUILD_VERSION}-aarch64"

          if [[ "$REF" != "refs/heads/main" && "$REF" != refs/tags/* ]]; then
            echo "workflow_dispatch must target main or a tag" >&2
            exit 1
          fi

          if [[ "$REF_NAME" == *-x86_64 || "$REF_NAME" == *-x86 ]]; then
            echo "x86_64 tags are not supported by this arm64-only workflow" >&2
            exit 1
          fi

          if [[ "$REF" == refs/tags/pre-* ]]; then
            prerelease="true"
          fi

          if [[ "$REF" == refs/tags/* ]]; then
            RELEASE_TAG="${REF_NAME}"
          fi

          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Print resolved build configuration
        run: |
          echo "build_version=${{ steps.build_config.outputs.build_version }}"
          echo "arch=arm64"
          echo "cross_compile=none"
          echo "release_tag=${{ steps.build_config.outputs.release_tag }}"
          echo "prerelease=${{ steps.build_config.outputs.prerelease }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          head -1 ~/.ssh/id_rsa
          tail -1 ~/.ssh/id_rsa

      - name: Launch EC2 instance
        id: launch-instance
        run: |
          AVAILABILITY_ZONES=("us-west-2a" "us-west-2b" "us-west-2c" "us-west-2d")
          INSTANCE_ID=""
          # Change ubuntu user UID to 1001 to match the builder user inside the chroot,
          # so artifacts written by builder are directly accessible by ubuntu on the host.
          USER_DATA='#!/bin/bash
              usermod -u 1001 ubuntu
              groupmod -g 1001 ubuntu
              chown -R ubuntu:ubuntu /home/ubuntu
              apt-get update
              apt-get install -y libarchive-tools arch-install-scripts'

          ARM64_AMI=$(aws ssm get-parameter \
            --name /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id \
            --query 'Parameter.Value' \
            --output text)
          echo "Using AMI: $ARM64_AMI"

          OUTPUT=$(aws ec2 run-instances \
            --image-id "$ARM64_AMI" \
            --instance-type c7g.8xlarge \
            --key-name github-actions-runner \
            --security-group-ids sg-09c18dc7c46327e69 \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":40,"VolumeType":"gp3"}}]' \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=github-runner-arm64}]' \
            --user-data "$USER_DATA" \
            --query 'Instances[0].InstanceId' \
            --output text 2>&1)
          EXIT_CODE=$?
          INSTANCE_ID="$OUTPUT"

          if [ $EXIT_CODE -ne 0 ] || [[ "$INSTANCE_ID" == *"InsufficientInstanceCapacity"* ]] || [[ "$INSTANCE_ID" == *"error"* ]] || [[ "$INSTANCE_ID" == *"Error"* ]] || [[ -z "$INSTANCE_ID" ]]; then
            echo "First attempt failed, trying specific availability zones..."
            INSTANCE_ID=""
            for AZ in "${AVAILABILITY_ZONES[@]}"; do
              echo "Trying availability zone: $AZ"
              OUTPUT=$(aws ec2 run-instances \
                --image-id "$ARM64_AMI" \
                --instance-type c7g.8xlarge \
                --key-name github-actions-runner \
                --security-group-ids sg-09c18dc7c46327e69 \
                --placement AvailabilityZone=$AZ \
                --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":40,"VolumeType":"gp3"}}]' \
                --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=github-runner-arm64}]' \
                --user-data "$USER_DATA" \
                --query 'Instances[0].InstanceId' \
                --output text 2>&1)
              EXIT_CODE=$?
              INSTANCE_ID="$OUTPUT"

              if [ $EXIT_CODE -eq 0 ] && [[ ! "$INSTANCE_ID" == *"InsufficientInstanceCapacity"* ]] && [[ ! "$INSTANCE_ID" == *"error"* ]] && [[ ! "$INSTANCE_ID" == *"Error"* ]] && [[ ! -z "$INSTANCE_ID" ]]; then
                echo "Successfully launched instance in $AZ: $INSTANCE_ID"
                break
              else
                echo "Failed to launch in $AZ: $INSTANCE_ID"
                INSTANCE_ID=""
              fi
            done
          else
            echo "Successfully launched instance (AWS-selected zone): $INSTANCE_ID"
          fi

          if [ -z "$INSTANCE_ID" ] || [[ "$INSTANCE_ID" == *"error"* ]] || [[ "$INSTANCE_ID" == *"Error"* ]] || [[ "$INSTANCE_ID" == *"InsufficientInstanceCapacity"* ]]; then
            echo "ERROR: Failed to launch instance in any availability zone"
            echo "Last attempt output: $INSTANCE_ID"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched instance: $INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "Instance running at: $PUBLIC_IP"

          echo "Waiting for SSH to be ready..."
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_rsa ubuntu@$PUBLIC_IP echo "SSH Ready" 2>/dev/null; then
              echo "SSH is ready!"
              break
            fi
            echo "Waiting for SSH... attempt $i/30"
            sleep 10
          done

      - name: Set up Arch Linux ARM chroot
        run: |
          ssh-keyscan -H ${{ steps.launch-instance.outputs.public_ip }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa ubuntu@${{ steps.launch-instance.outputs.public_ip }} << 'EOF'
            set -euo pipefail

            # Wait for cloud-init (USER_DATA) to finish installing packages
            cloud-init status --wait || true

            echo "==> Downloading Arch Linux ARM filesystem..."
            wget -q http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz -O /tmp/archarm.tar.gz

            echo "==> Extracting filesystem to /opt/arch-chroot..."
            sudo mkdir -p /opt/arch-chroot
            sudo bsdtar -xpf /tmp/archarm.tar.gz -C /opt/arch-chroot
            rm /tmp/archarm.tar.gz

            echo "==> Installing arch-chroot from upstream..."
            sudo apt-get install -y --no-install-recommends make m4
            git clone --depth 1 https://github.com/archlinux/arch-install-scripts.git /tmp/arch-install-scripts
            make -C /tmp/arch-install-scripts arch-chroot
            sudo install -m 755 /tmp/arch-install-scripts/arch-chroot /usr/local/bin/arch-chroot
            rm -rf /tmp/arch-install-scripts

            echo "==> Writing DNS configuration..."
            sudo rm -f /opt/arch-chroot/etc/resolv.conf
            printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee /opt/arch-chroot/etc/resolv.conf > /dev/null

            echo "==> Configuring pacman mirrors..."
            printf '%s\n' \
              'Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://ca.us.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://fl.us.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://eu.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://de.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://de3.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://de4.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://dk.mirror.archlinuxarm.org/$arch/$repo' \
              'Server = http://mirror.archlinuxarm.org/$arch/$repo' \
              | sudo tee /opt/arch-chroot/etc/pacman.d/mirrorlist > /dev/null

            echo "==> Bind-mounting chroot dir (required for pacman 7.x mountpoint detection)..."
            sudo mount --bind /opt/arch-chroot /opt/arch-chroot

            echo "==> Initializing pacman keyring..."
            sudo arch-chroot /opt/arch-chroot pacman-key --init
            sudo arch-chroot /opt/arch-chroot pacman-key --populate archlinuxarm

            echo "==> Updating system..."
            sudo arch-chroot /opt/arch-chroot pacman -Syu --noconfirm

            echo "==> Installing build dependencies..."
            sudo arch-chroot /opt/arch-chroot pacman -S --noconfirm \
              base base-devel tzdata
            sudo arch-chroot /opt/arch-chroot bash -c "
              ln -sf /usr/share/zoneinfo/America/Los_Angeles /etc/localtime
              echo 'America/Los_Angeles' > /etc/timezone
            "
            sudo arch-chroot /opt/arch-chroot pacman -S --noconfirm \
              dracut git bc kmod inetutils cpio perl tar xz wget python python-pip vim sudo patch
            sudo arch-chroot /opt/arch-chroot pacman -S --noconfirm \
              dtc libelf flex bison openssl rsync curl arch-install-scripts
            sudo arch-chroot /opt/arch-chroot pacman -S --noconfirm \
              parted
            sudo arch-chroot /opt/arch-chroot pacman -S --noconfirm \
              gdb strace lsof pciutils usbutils iproute2 net-tools \
              man-db man-pages less which file htop tmux unzip zip
            sudo arch-chroot /opt/arch-chroot pacman -Scc --noconfirm

            echo "==> Creating builder user (UID 1001)..."
            sudo arch-chroot /opt/arch-chroot useradd -m -u 1001 -G wheel -s /bin/bash builder
            echo '%wheel ALL=(ALL) NOPASSWD: ALL' | sudo tee -a /opt/arch-chroot/etc/sudoers > /dev/null

            echo "==> Installing yay and bmaptool from AUR..."
            sudo arch-chroot /opt/arch-chroot /bin/bash -c "
              cd /tmp
              git clone https://aur.archlinux.org/yay.git
              chown -R builder:builder /tmp/yay
              su builder -c 'cd /tmp/yay && makepkg -si --noconfirm'
              su builder -c 'yay -S --noconfirm --needed --answerdiff=None --answerclean=None bmaptool'
              rm -rf /tmp/yay
            "

            echo "==> Configuring git for builder user..."
            sudo arch-chroot /opt/arch-chroot su - builder -c "
              git config --global user.email 'build@mntar.ch'
              git config --global user.name 'MNT-Build Bot'
              git config --global --add safe.directory '*'
            "


            echo "==> Arch Linux ARM chroot is ready."

            echo "==> Releasing bind mount..."
            sudo umount /opt/arch-chroot 2>/dev/null || true
          EOF

      - name: Clone repository
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ steps.launch-instance.outputs.public_ip }} << 'EOF'
            set -euo pipefail
            git clone --depth 1 --no-checkout https://github.com/${{ github.repository }} /opt/arch-chroot/home/builder/mnt-build
            cd /opt/arch-chroot/home/builder/mnt-build
            git fetch --depth 1 origin ${{ github.sha }}
            git checkout ${{ github.sha }}
            git submodule update --init --recursive --depth 1
          EOF

      - name: Run build
        id: run_build
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ steps.launch-instance.outputs.public_ip }} << 'EOF'
            set -euo pipefail
            sudo mount --bind /opt/arch-chroot /opt/arch-chroot
            sudo arch-chroot /opt/arch-chroot su - builder -c "
              cd ~/mnt-build/scripts &&
              python3 build-auto.py --with-headers --cross-compile none
            "
            sudo umount /opt/arch-chroot 2>/dev/null || true
          EOF

      - name: Collect logs
        if: always()
        run: |
          mkdir -p build-logs
          # Builder UID 1001 == ubuntu UID 1001, so no sudo needed to read artifacts
          ssh -i ~/.ssh/id_rsa ubuntu@${{ steps.launch-instance.outputs.public_ip }} \
            "find /opt/arch-chroot/home/builder/mnt-build -maxdepth 1 -name '*.log' -type f -exec cp {} /tmp/ \; 2>/dev/null || true; \
             find /opt/arch-chroot/home/builder/mnt-build/scripts -name '*.log' -type f -exec cp {} /tmp/ \; 2>/dev/null || true"
          scp -i ~/.ssh/id_rsa ubuntu@${{ steps.launch-instance.outputs.public_ip }}:/tmp/*.log build-logs/ 2>/dev/null || true
          echo "Collected logs:"
          ls -lh build-logs/

      - name: Copy kernel artifacts
        if: ${{ steps.run_build.outcome == 'success' }}
        run: |
          mkdir -p release-artifacts
          scp -i ~/.ssh/id_rsa "ubuntu@${{ steps.launch-instance.outputs.public_ip }}:/opt/arch-chroot/home/builder/mnt-build/kernel-*.tar.gz" release-artifacts/ || true
          ls -lh release-artifacts/

      - name: Copy headers artifacts
        if: ${{ steps.run_build.outcome == 'success' }}
        run: |
          mkdir -p release-artifacts
          scp -i ~/.ssh/id_rsa "ubuntu@${{ steps.launch-instance.outputs.public_ip }}:/opt/arch-chroot/home/builder/mnt-build/headers-*.tar.gz" release-artifacts/ || true
          ls -lh release-artifacts/

      - name: Copy module artifacts
        if: ${{ steps.run_build.outcome == 'success' }}
        run: |
          mkdir -p release-artifacts
          scp -i ~/.ssh/id_rsa "ubuntu@${{ steps.launch-instance.outputs.public_ip }}:/opt/arch-chroot/home/builder/mnt-build/reform2_lpc-*.tar.gz" release-artifacts/ || true
          scp -i ~/.ssh/id_rsa "ubuntu@${{ steps.launch-instance.outputs.public_ip }}:/opt/arch-chroot/home/builder/mnt-build/wlan-*.tar.gz" release-artifacts/ || true
          ls -lh release-artifacts/

      - name: Terminate EC2 instance
        if: always()
        run: |
          aws ec2 terminate-instances --instance-ids ${{ steps.launch-instance.outputs.instance_id }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/*

      - name: Upload artifacts
        if: ${{ steps.run_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            release-artifacts/kernel-*.tar.gz
            release-artifacts/headers-*.tar.gz
            release-artifacts/reform2_lpc-*.tar.gz
            release-artifacts/wlan-*.tar.gz

      - name: Create Release
        if: >
          startsWith(github.ref, 'refs/tags/') &&
          steps.run_build.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.build_config.outputs.release_tag }}
          name: ${{ steps.build_config.outputs.release_tag }}
          files: |
            release-artifacts/kernel-*.tar.gz
            release-artifacts/headers-*.tar.gz
            release-artifacts/reform2_lpc-*.tar.gz
            release-artifacts/wlan-*.tar.gz
          draft: false
          prerelease: ${{ steps.build_config.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
